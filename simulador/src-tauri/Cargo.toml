[package]
name = "poxi-optimizer-sim"
version = "2.0.0"
description = "PoxiOptimizer (Simulador) - demostracion de la interfaz, no modifica el sistema"
authors = ["Poxi"]
edition = "2021"

[lib]
name = "poxi_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Perfil de release optimizado para tamano minimo del ejecutable final.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
